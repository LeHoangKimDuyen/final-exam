<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — Triển lãm Nghệ thuật Ngôn từ</title>

    <!-- Google Fonts: Playfair Display & Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ==========================================================================
       DESIGN TOKENS & RESET
       ========================================================================== */
      :root {
        --clr-bg-main: #f6f0e0; /* Lemon Cream - Nền toàn trang */
        --clr-surface: #fcf9f0; /* Trắng ấm - Nền bề mặt form */
        --clr-primary: #7b1113; /* Red Wine - Điểm nhấn chính */
        --clr-primary-dark: #52090c; /* Red Wine Dark - Hover */
        --clr-text-main: #2d1a1a; /* Nâu đỏ sẫm - Chữ chính */
        --clr-text-muted: #7a6363; /* Nâu nhạt - Nhãn & trích dẫn phụ */
        --clr-border: #e3d8c3; /* Viền mỏng */

        --font-heading: "Playfair Display", Georgia, serif;
        --font-body:
          "Be Vietnam Pro", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-body);
        color: var(--clr-text-main);
        background-color: var(--clr-bg-main);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* ==========================================================================
       SPLIT-SCREEN AUTH CONTAINER
       ========================================================================== */
      .auth-container {
        display: flex;
        min-height: 100vh;
        width: 100vw;
      }

      /* --- Khối Trái (Quote nghệ thuật - 45%) --- */
      .auth-quote-panel {
        flex: 0 0 45%;
        background-color: var(--clr-bg-main);
        padding: 80px 10%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        border-right: 1px solid var(--clr-border);
      }

      .brand-back-link {
        font-family: var(--font-heading);
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--clr-primary);
        text-decoration: none;
        letter-spacing: 0.04em;
        align-self: flex-start;
      }

      .quote-wrapper {
        margin: auto 0;
      }

      .editorial-quote {
        font-family: var(--font-heading);
        font-size: clamp(2rem, 3.2vw, 3rem);
        font-weight: 600;
        line-height: 1.25;
        color: var(--clr-primary);
        text-align: left;
        margin-bottom: 24px;
        letter-spacing: -0.01em;
      }

      .quote-author {
        font-family: var(--font-body);
        font-size: 0.9375rem;
        color: var(--clr-text-muted);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .panel-footer-text {
        font-size: 0.8125rem;
        color: var(--clr-text-muted);
      }

      /* --- Khối Phải (Form - 55%) --- */
      .auth-form-panel {
        flex: 0 0 55%;
        background-color: var(--clr-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 60px 10%;
      }

      .auth-form-wrapper {
        width: 100%;
        max-width: 420px;
      }

      .form-header {
        margin-bottom: 40px;
      }

      .form-title {
        font-family: var(--font-heading);
        font-size: 2.25rem;
        font-weight: 600;
        color: var(--clr-text-main);
        margin-bottom: 12px;
        line-height: 1.2;
      }

      .form-subtitle {
        font-size: 0.9375rem;
        color: var(--clr-text-muted);
      }

      /* --- Form Elements --- */
      .form-group {
        margin-bottom: 32px;
        display: flex;
        flex-direction: column;
      }

      .form-label {
        font-size: 0.8125rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--clr-text-muted);
        margin-bottom: 8px;
      }

      .form-input {
        font-family: var(--font-body);
        font-size: 1rem;
        color: var(--clr-text-main);
        background-color: transparent;
        border: none;
        border-bottom: 1px solid var(--clr-border);
        border-radius: 0; /* Anti-AI: Tuyệt đối không bo tròn */
        padding: 12px 0;
        outline: none;
        transition: border-color 0.3s ease;
      }

      .form-input::placeholder {
        color: rgba(122, 99, 99, 0.45);
      }

      .form-input:focus {
        border-bottom-color: var(--clr-primary);
      }

      /* Nút Submit sắc sảo */
      .btn-submit {
        font-family: var(--font-body);
        font-size: 0.9375rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffffff;
        background-color: var(--clr-primary);
        border: 1px solid var(--clr-primary);
        border-radius: 2px; /* Bo góc tối đa 2px theo quy chuẩn */
        padding: 16px 24px;
        width: 100%;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          border-color 0.3s ease;
        margin-top: 12px;
      }

      .btn-submit:hover {
        background-color: var(--clr-primary-dark);
        border-color: var(--clr-primary-dark);
      }

      .form-footer {
        margin-top: 32px;
        text-align: center;
        font-size: 0.875rem;
        color: var(--clr-text-muted);
      }

      .form-footer a {
        color: var(--clr-primary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s ease;
      }

      .form-footer a:hover {
        color: var(--clr-primary-dark);
        text-decoration: underline;
      }

      /* ==========================================================================
       RESPONSIVE DESIGN (MOBILE - DƯỚI 768PX)
       ========================================================================== */
      @media (max-width: 768px) {
        .auth-quote-panel {
          display: none; /* Ẩn hoàn toàn khối trái */
        }

        .auth-form-panel {
          flex: 0 0 100%; /* Khối phải chiếm 100% chiều rộng */
          width: 100%;
          padding: 60px 8%;
          min-height: 100vh;
        }

        .auth-form-wrapper {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="auth-container">
      <!-- KHỐI TRÁI: Trích dẫn văn học nghệ thuật (45%) -->
      <aside class="auth-quote-panel">
        <a href="index.html" class="brand-back-link">L'Écrit</a>

        <div class="quote-wrapper">
          <blockquote class="editorial-quote">
            "Một cuốn sách thực sự tốt không chỉ mở ra một chân trời mới, mà còn
            trả lại cho ta chính tâm hồn mình."
          </blockquote>
          <cite class="quote-author">— Trầm tích ký ức</cite>
        </div>

        <p class="panel-footer-text">© Triển lãm Nghệ thuật Ngôn từ</p>
      </aside>

      <!-- KHỐI PHẢI: Form Đăng nhập (55%) -->
      <section class="auth-form-panel">
        <div class="auth-form-wrapper">
          <header class="form-header">
            <h2 class="form-title">Đăng nhập</h2>
            <p class="form-subtitle">
              Bước vào hành trình chiêm nghiệm và lưu giữ những áng văn bất tận.
            </p>
          </header>

          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="username-input" class="form-label"
                >Tên tài khoản</label
              >
              <input
                type="text"
                id="username-input"
                name="username"
                class="form-input"
                placeholder="Nhập tên tài khoản..."
                autocomplete="username"
                required
              />
            </div>

            <div class="form-group">
              <label for="password-input" class="form-label">Mật khẩu</label>
              <input
                type="password"
                id="password-input"
                name="password"
                class="form-input"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn-submit">Tiếp tục</button>

            <footer class="form-footer">
              <p>Chưa có tài khoản? <a href="#">Đăng ký lưu trữ</a></p>
            </footer>
          </form>
        </div>
      </section>
    </main>
  </body>
  <script>
    /* ==========================================================================
       AUTH SCRIPT: GIẢ LẬP ĐĂNG NHẬP BẰNG LOCALSTORAGE
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("login-form");
      const usernameInput = document.getElementById("username-input");

      if (!loginForm || !usernameInput) return;

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        if (!username) {
          usernameInput.focus();
          return;
        }

        // Lưu thông tin người dùng vào localStorage
        const userObj = {
          name: username,
          loggedInAt: new Date().toISOString(),
        };
        localStorage.setItem("currentUser", JSON.stringify(userObj));

        // Chuyển hướng về trang chủ
        window.location.href = "index.html";
      });
    });
    /* ==========================================================================
       AUTH SCRIPT: GIẢ LẬP ĐĂNG NHẬP BẰNG LOCALSTORAGE
       ========================================================================== */
    document.addEventListener("DOMContentLoaded", () => {
      const loginForm = document.getElementById("login-form");
      const usernameInput = document.getElementById("username-input");

      if (!loginForm || !usernameInput) return;

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        if (!username) {
          usernameInput.focus();
          return;
        }

        // Lưu thông tin người dùng vào localStorage
        const userObj = {
          name: username,
          loggedInAt: new Date().toISOString(),
        };
        localStorage.setItem("currentUser", JSON.stringify(userObj));

        // Chuyển hướng về trang chủ
        window.location.href = "index.html";
      });
    });
  </script>
</html>
